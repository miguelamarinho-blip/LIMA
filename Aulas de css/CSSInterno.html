<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie-edge">
    <title>CSS_Interno</title>
    <!-- Declaração do CSS Interno -->
    <style>
        h1 {
            color: red;
            text-align: center;
            font-size: 72px;
        }

        p {
            font-size: 72px;
            text-align: center;
        }

        .fonte {
            color: blue;
            text-align: center;
        }
    </style>

</head>

<body>
    <h1>Miguel Arcanjo de Sousa Marinho</h1>
    <p>Estudante de Desenvolvimento de Sistemas</p>
    <p>Lista de cursos</p>
    <h2 class="fonte">Lista de Cursos TRANSVERSAIS</h2>
</body>

</html>
